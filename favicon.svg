<!-- Simplified Aperture mark for browser-tab sizes (16-32px). Kit variant
     #08: two filled rects (outer faint, inner stronger) + a larger accent
     center dot. The stroked three-ring version turns to mush at 16px, so
     favicons use this solid-fill form instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="8" y="8" width="48" height="48" rx="6" fill="#17182a" opacity="0.15"/>
  <rect x="20" y="20" width="24" height="24" rx="4" transform="rotate(30 32 32)" fill="#17182a" opacity="0.55"/>
  <circle cx="32" cy="32" r="8" fill="#6d2cc8"/>
</svg>
